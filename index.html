Quantum computing represents a fundamental paradigm shift from classical digital computation. While classical computers rely on binary bits constrained to states of strictly **0** or **1**, quantum processors harness the counter-intuitive mechanics of quantum physics.

## Core Pillars of Quantum Computation

1. **Quantum Superposition**:
   A qubit can exist in a linear combination of states $|0\\rangle$ and $|1\\rangle$ simultaneously, represented as $|\\psi\\rangle = \\alpha|0\\rangle + \\beta|1\\rangle$. This exponential expansion enables $N$ qubits to evaluate $2^N$ states in parallel.

    // Model Pricing Presets (Per 1 Million Tokens)
    const MODEL_PRICING = {
      'gpt-4o': { name: 'GPT-4o', outputCostPer1M: 10.00, inputCostPer1M: 2.50 },
      'claude-sonnet': { name: 'Claude 3.5 Sonnet', outputCostPer1M: 15.00, inputCostPer1M: 3.00 },
      'deepseek-v3': { name: 'DeepSeek V3 / R1', outputCostPer1M: 0.55, inputCostPer1M: 0.14 },
      'llama-70b': { name: 'Llama 3.3 70B (Groq)', outputCostPer1M: 0.79, inputCostPer1M: 0.59 }
    };

    // Deterministic Token Hash ID Generator
    function stringToTokenId(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash % 90000) + 10000;
    }

    // ==========================================
    // BPE / WORD / CHAR TOKENIZER ENGINE
    // ==========================================
    function tokenizeText(text, mode) {
      if (!text) return [];

      // 1. Character Mode
      if (mode === 'char') {
        return text.split('').map((ch, idx) => ({
          idx,
          id: 1000 + (ch.charCodeAt(0) % 89000),
          text: ch,
          type: ch === '\n' ? 'newline' : ch === ' ' ? 'space' : 'char',
          length: 1,
          bytes: new TextEncoder().encode(ch).length
        }));
      }

      // 2. Word Mode
      if (mode === 'word') {
        const regex = /(\s+|[a-zA-Z0-9_]+|[^\s\a-zA-Z0-9_])/g;
        const matches = text.match(regex) || [];
        return matches.map((m, idx) => ({
          idx,
          id: stringToTokenId(m),
          text: m,
          type: m.includes('\n') ? 'newline' : /^\s+$/.test(m) ? 'space' : /[^\w\s]/.test(m) ? 'punct' : 'word',
          length: m.length,
          bytes: new TextEncoder().encode(m).length
        }));
      }

      // 3. Simulated BPE Subword Mode
      const tokens = [];
      const primaryRegex = /(\n\n|\n| {4}| {2}|(?<=\s)[a-zA-Z0-9_]+|[a-zA-Z0-9_]+|\s+|[^\s\a-zA-Z0-9_])/g;
      const rawParts = text.match(primaryRegex) || [];

      const prefixes = [
        'inter', 'trans', 'super', 'under', 'multi', 'hyper', 'cyber', 'quant', 'async',
        'simul', 'gener', 'token', 'artif', 'intell', 'system', 'stream', 'function', 'import'
      ];

      const suffixes = [
        'ization', 'izing', 'tions', 'tion', 'able', 'ment', 'ness', 'fully', 'ally',
        'istic', 'less', 'ship', 'ing', 'est', 'ous', 'ive', 'ize', 'ted'
      ];

      rawParts.forEach(part => {
        if (part.includes('\n') || part.length <= 4 || /^[^\w\s]+$/.test(part) || /^\s+$/.test(part)) {
          tokens.push({
            id: stringToTokenId(part),
            text: part,
            type: part.includes('\n') ? 'newline' : /^\s+$/.test(part) ? 'space' : /[^\w\s]/.test(part) ? 'punct' : 'word'
          });
          return;
        }

        let wordStr = part;
        let handled = false;
        let leadSpace = '';

        if (wordStr.startsWith(' ')) {
          leadSpace = ' ';
          wordStr = wordStr.slice(1);
        }

        const lower = wordStr.toLowerCase();

        // Check suffix split
        for (const suf of suffixes) {
          if (lower.endsWith(suf) && lower.length - suf.length >= 3) {
            const prefixPart = leadSpace + wordStr.slice(0, wordStr.length - suf.length);
            const suffixPart = wordStr.slice(wordStr.length - suf.length);

            tokens.push({ id: stringToTokenId(prefixPart), text: prefixPart, type: 'subword-root' });
            tokens.push({ id: stringToTokenId(suffixPart), text: suffixPart, type: 'subword-suffix' });
            handled = true;
            break;
          }
        }

        if (!handled) {
          for (const pre of prefixes) {
            if (lower.startsWith(pre) && lower.length - pre.length >= 3) {
              const prefixPart = leadSpace + wordStr.slice(0, pre.length);
              const restPart = wordStr.slice(pre.length);

              tokens.push({ id: stringToTokenId(prefixPart), text: prefixPart, type: 'subword-prefix' });
              tokens.push({ id: stringToTokenId(restPart), text: restPart, type: 'subword-root' });
              handled = true;
              break;
            }
          }
        }

        if (!handled) {
          if (wordStr.length > 10) {
            const mid = Math.floor(wordStr.length / 2);
            const part1 = leadSpace + wordStr.slice(0, mid);
            const part2 = wordStr.slice(mid);
            tokens.push({ id: stringToTokenId(part1), text: part1, type: 'subword' });
            tokens.push({ id: stringToTokenId(part2), text: part2, type: 'subword' });
          } else {
            tokens.push({ id: stringToTokenId(part), text: part, type: 'word' });
          }
        }
      });

      return tokens.map((t, idx) => ({
        ...t,
        idx,
        length: t.text.length,
        bytes: new TextEncoder().encode(t.text).length
      }));
    }

    // ==========================================
    // WEB AUDIO SOUND SYNTHESIZER
    // ==========================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.volume = 0.25;
        this.soundType = 'digital'; // 'digital', 'mechanical', 'cyberpunk', 'typewriter', 'none'
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTokenSound() {
        if (this.soundType === 'none' || this.volume <= 0) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;

        if (this.soundType === 'digital') {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const freq = 850 + Math.random() * 250;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.025);

          gain.gain.setValueAtTime(this.volume * 0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.025);

        } else if (this.soundType === 'mechanical') {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(200 + Math.random() * 50, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.035);

          gain.gain.setValueAtTime(this.volume * 0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.035);

        } else if (this.soundType === 'cyberpunk') {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          const base = 500 + Math.random() * 200;
          osc.frequency.setValueAtTime(base, now);
          osc.frequency.linearRampToValueAtTime(base * 1.6, now + 0.03);

          gain.gain.setValueAtTime(this.volume * 0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.03);

        } else if (this.soundType === 'typewriter') {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(1400 + Math.random() * 400, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.02);

          gain.gain.setValueAtTime(this.volume * 0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.02);
        }
      }
    }

    const soundEngine = new SoundEngine();

    // ==========================================
    // MAIN REACT APPLICATION COMPONENT
    // ==========================================
    function App() {
      // Configuration & Preset State
      const [presetKey, setPresetKey] = useState('monologue');
      const [customText, setCustomText] = useState(TEXT_PRESETS.monologue.text);
      const [tokenizerMode, setTokenizerMode] = useState('bpe'); // 'bpe', 'word', 'char'
      const [speedTps, setSpeedTps] = useState(30); // 1 to 250, or 'max'
      const [isMaxSpeed, setIsMaxSpeed] = useState(false);
      const [jitterPct, setJitterPct] = useState(15); // 0 to 100%
      const [soundType, setSoundType] = useState('digital');
      const [soundVolume, setSoundVolume] = useState(0.25);
      const [selectedModel, setSelectedModel] = useState('gpt-4o');

      // Display & View Options
      const [viewMode, setViewMode] = useState('rendered'); // 'rendered', 'badges', 'inspector'
      const [showTokenIDs, setShowTokenIDs] = useState(true);
      const [autoScroll, setAutoScroll] = useState(true);
      const [copied, setCopied] = useState(false);

      // Simulation Stream State
      const [tokenList, setTokenList] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);

      // Analytics & Timing State
      const [startTime, setStartTime] = useState(null);
      const [elapsedMs, setElapsedMs] = useState(0);
      const [realtimeTps, setRealtimeTps] = useState(0);
      const [tpsHistory, setTpsHistory] = useState([]);
      const [hoveredToken, setHoveredToken] = useState(null);

      // References
      const outputContainerRef = useRef(null);
      const canvasRef = useRef(null);
      const streamTimerRef = useRef(null);
      const lastTokenTimeRef = useRef(null);
      const recentTimestampsRef = useRef([]);

      // Initialize Sound Engine Settings
      useEffect(() => {
        soundEngine.soundType = soundType;
        soundEngine.volume = soundVolume;
      }, [soundType, soundVolume]);

      // Re-tokenize when text preset or tokenizer mode changes
      useEffect(() => {
        const textToTokenize = presetKey === 'custom' ? customText : TEXT_PRESETS[presetKey].text;
        const tokens = tokenizeText(textToTokenize, tokenizerMode);
        setTokenList(tokens);
        setCurrentIndex(0);
        setIsPlaying(false);
        setStartTime(null);
        setElapsedMs(0);
        setRealtimeTps(0);
        setTpsHistory([]);
      }, [presetKey, customText, tokenizerMode]);

      // Handle Output Auto Scroll
      useEffect(() => {
        if (autoScroll && outputContainerRef.current) {
          outputContainerRef.current.scrollTop = outputContainerRef.current.scrollHeight;
        }
      }, [currentIndex, viewMode, autoScroll]);

      // Calculate Accumulated Generated Output Text
      const generatedText = useMemo(() => {
        return tokenList.slice(0, currentIndex).map(t => t.text).join('');
      }, [tokenList, currentIndex]);

      // Total Characters Generated
      const accumulatedChars = useMemo(() => {
        return generatedText.length;
      }, [generatedText]);

      // Rendered HTML from Markdown
      const renderedMarkdownHtml = useMemo(() => {
        if (!generatedText) return '';
        try {
          return marked.parse(generatedText);
        } catch (e) {
          return generatedText;
        }
      }, [generatedText]);

      // Estimated Cost Calculation
      const estimatedCost = useMemo(() => {
        const model = MODEL_PRICING[selectedModel] || MODEL_PRICING['gpt-4o'];
        const cost = (currentIndex / 1000000) * model.outputCostPer1M;
        return cost < 0.0001 ? cost.toFixed(6) : cost.toFixed(4);
      }, [currentIndex, selectedModel]);

      // Elapsed & ETA Calculations
      const formattedElapsed = (elapsedMs / 1000).toFixed(2) + 's';
      const remainingTokens = tokenList.length - currentIndex;
      const etaMs = realtimeTps > 0 ? (remainingTokens / realtimeTps) * 1000 : 0;
      const formattedEta = realtimeTps > 0 && remainingTokens > 0 
        ? (etaMs / 1000).toFixed(1) + 's' 
        : '0.0s';

      // Chars / Token Efficiency
      const charsPerToken = currentIndex > 0 ? (accumulatedChars / currentIndex).toFixed(2) : '0.00';

      // Single Token Advance Step Logic
      const advanceToken = useCallback(() => {
        setCurrentIndex((prev) => {
          if (prev >= tokenList.length) {
            setIsPlaying(false);
            if (window.confetti && tokenList.length > 0) {
              window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
            }
            return prev;
          }

          soundEngine.playTokenSound();

          const now = performance.now();
          // Record timestamp for rolling TPS calculation
          recentTimestampsRef.current.push(now);
          if (recentTimestampsRef.current.length > 20) {
            recentTimestampsRef.current.shift();
          }

          // Calculate rolling average TPS
          if (recentTimestampsRef.current.length > 1) {
            const firstTS = recentTimestampsRef.current[0];
            const durationSec = (now - firstTS) / 1000;
            if (durationSec > 0) {
              const currentTPS = (recentTimestampsRef.current.length - 1) / durationSec;
              setRealtimeTps(Math.round(currentTPS));
              setTpsHistory((prevHist) => [...prevHist.slice(-40), Math.round(currentTPS)]);
            }
          }

          return prev + 1;
        });
      }, [tokenList]);

      // Main Streaming Loop Scheduler
      useEffect(() => {
        if (!isPlaying || currentIndex >= tokenList.length) {
          if (streamTimerRef.current) clearTimeout(streamTimerRef.current);
          return;
        }

        if (!startTime) {
          setStartTime(performance.now());
        }

        const scheduleNextToken = () => {
          if (isMaxSpeed) {
            // MAX Speed / Instant burst mode
            const batchSize = Math.max(1, Math.floor(tokenList.length / 20));
            setCurrentIndex((prev) => {
              const nextVal = Math.min(tokenList.length, prev + batchSize);
              if (nextVal >= tokenList.length) {
                setIsPlaying(false);
                if (window.confetti) window.confetti({ particleCount: 60, spread: 70, origin: { y: 0.8 } });
              }
              return nextVal;
            });
            soundEngine.playTokenSound();
            streamTimerRef.current = setTimeout(scheduleNextToken, 16); // ~60fps
            return;
          }

          // Calculate delay based on TPS target
          const targetDelayMs = 1000 / speedTps;
          
          // Apply Latency Jitter
          let actualDelay = targetDelayMs;
          if (jitterPct > 0) {
            const factor = (Math.random() - 0.5) * 2 * (jitterPct / 100);
            actualDelay = targetDelayMs * (1 + factor);

            // Random structural pause for LLM reasoning simulation
            const nextTok = tokenList[currentIndex];
            if (nextTok && (nextTok.text.includes('\n') || nextTok.text.includes('```')) && Math.random() < 0.25) {
              actualDelay += 80 + Math.random() * 120;
            }
          }

          actualDelay = Math.max(2, actualDelay);

          streamTimerRef.current = setTimeout(() => {
            advanceToken();
            scheduleNextToken();
          }, actualDelay);
        };

        scheduleNextToken();

        return () => {
          if (streamTimerRef.current) clearTimeout(streamTimerRef.current);
        };
      }, [isPlaying, currentIndex, tokenList, speedTps, isMaxSpeed, jitterPct, advanceToken]);

      // Timer update for elapsed time
      useEffect(() => {
        let interval = null;
        if (isPlaying && startTime) {
          interval = setInterval(() => {
            setElapsedMs(performance.now() - startTime);
          }, 50);
        } else {
          clearInterval(interval);
        }
        return () => clearInterval(interval);
      }, [isPlaying, startTime]);

      // Render TPS Sparkline Canvas
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        ctx.clearRect(0, 0, width, height);

        if (tpsHistory.length < 2) {
          ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
          ctx.font = '10px JetBrains Mono';
          ctx.fillText('Awaiting live telemetry...', 10, 20);
          return;
        }

        const maxTPS = Math.max(...tpsHistory, speedTps, 10);
        const stepX = width / (tpsHistory.length - 1);

        // Draw Area Gradient
        ctx.beginPath();
        ctx.moveTo(0, height);
        tpsHistory.forEach((val, i) => {
          const x = i * stepX;
          const y = height - (val / maxTPS) * (height - 8);
          ctx.lineTo(x, y);

          const x = i * stepX;
          const y = height - (val / maxTPS) * (height - 8);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });

        ctx.lineWidth = 2;
        ctx.stroke();

                    ) : (
                      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                      </svg>
                    )}
                  </button>
                </div>

              </div>

              {/* TERMINAL FRAME CONTAINING GENERATED CONTENT */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl flex flex-col flex-1 min-h-[500px]">
                
                {/* Terminal Window Header Bar */}
                <div className="bg-slate-950 px-4 py-2.5 border-b border-slate-800 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
                    <span className="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
                    <span className="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                    <span className="text-xs font-mono text-slate-400 ml-2">
                      {viewMode === 'rendered' && 'Rendered Preview Terminal'}
                      {viewMode === 'badges' && 'Token Subword Boundary Visualizer'}
                      {viewMode === 'inspector' && 'Token Matrix Inspector Grid'}
                    </span>
                  </div>

                  <div className="flex items-center gap-3">
                    <label className="flex items-center gap-1.5 text-[11px] text-slate-400 cursor-pointer">
                      <input 
                        type="checkbox" 
                        checked={autoScroll} 
                        onChange={(e) => setAutoScroll(e.target.checked)} 
                        className="rounded accent-cyan-500"
                      />
                      Auto Scroll
                    </label>
                  </div>
                </div>

                {/* MAIN STREAM CONTENT AREA */}
                <div 
                  ref={outputContainerRef}
                  className="p-5 flex-1 overflow-y-auto max-h-[620px] font-sans relative text-slate-200"
                >

                  {/* 1. RENDERED MARKDOWN VIEW */}
                  {viewMode === 'rendered' && (
                    <div className="prose prose-invert max-w-none prose-pre:bg-slate-950 prose-pre:border prose-pre:border-slate-800 text-sm leading-relaxed">
                      {generatedText ? (
                        <>
                          <div dangerouslySetInnerHTML={{ __html: renderedMarkdownHtml }}></div>
                          {currentIndex < tokenList.length && <span className="terminal-cursor"></span>}
                        </>
                      ) : (
                        <div className="text-slate-400 italic font-mono text-xs text-center py-20">
                          Stream empty. Press "Play Stream" or Step forward to generate tokens...
                        </div>
                      )}
                    </div>
                  )}

                  {/* 2. TOKEN BADGES VISUALIZER VIEW */}
                  {viewMode === 'badges' && (
                    <div className="flex flex-wrap items-baseline gap-1.5 font-mono text-xs leading-loose">
                      {tokenList.slice(0, currentIndex).map((tok, i) => {
                        // Dynamic Pastel/Neon Badge Color Alternator
                        const colors = [
                          'bg-emerald-950/80 text-emerald-300 border-emerald-800/80 hover:bg-emerald-800/90',
                          'bg-cyan-950/80 text-cyan-300 border-cyan-800/80 hover:bg-cyan-800/90',
                          'bg-purple-950/80 text-purple-300 border-purple-800/80 hover:bg-purple-800/90',
                          'bg-amber-950/80 text-amber-300 border-amber-800/80 hover:bg-amber-800/90',
                          'bg-pink-950/80 text-pink-300 border-pink-800/80 hover:bg-pink-800/90',
                          'bg-indigo-950/80 text-indigo-300 border-indigo-800/80 hover:bg-indigo-800/90',
                        ];
                        const badgeColor = colors[i % colors.length];

                        if (tok.text === '\n' || tok.text === '\n\n') {
                          return (
                            <React.Fragment key={i}>
                              <span 
                                onMouseEnter={() => setHoveredToken(tok)}
                                onMouseLeave={() => setHoveredToken(null)}
                                className={`token-badge border px-1.5 py-0.5 rounded text-[10px] opacity-60 ${badgeColor}`}
                              >
                                ↵
                              </span>
                              <div className="w-full h-0"></div>
                            </React.Fragment>
                          );
                        }

                        return (
                          <span
                            key={i}
                            onMouseEnter={() => setHoveredToken(tok)}
                            onMouseLeave={() => setHoveredToken(null)}
                            className={`token-badge inline-block border px-1.5 py-0.5 rounded cursor-pointer ${badgeColor}`}
                          >
                            {tok.text.replace(/ /g, '␣')}
                            {showTokenIDs && (
                              <sub className="text-[9px] opacity-60 ml-1 font-sans">#{tok.id}</sub>
                            )}
                          </span>
                        );
                      })}

                      {currentIndex < tokenList.length && (
                        <span className="terminal-cursor"></span>
                      )}

                      {currentIndex === 0 && (
                        <div className="text-slate-400 italic font-mono text-xs text-center py-20 w-full">
                          Press "Play Stream" to watch text tokenize into color-coded BPE subword badges...
                        </div>
                      )}
                    </div>
                  )}

                  {/* 3. TOKEN MATRIX INSPECTOR GRID VIEW */}
                  {viewMode === 'inspector' && (
                    <div className="overflow-x-auto">
                      <table className="w-full text-left font-mono text-xs">
                        <thead>
                          <tr className="border-b border-slate-800 text-slate-400 uppercase text-[10px]">
                            <th className="py-2 px-3">Index</th>
                            <th className="py-2 px-3">Token ID</th>
                            <th className="py-2 px-3">String Fragment</th>
                            <th className="py-2 px-3">Type</th>
                            <th className="py-2 px-3">Length</th>
                            <th className="py-2 px-3">Bytes</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60">
                          {tokenList.slice(0, currentIndex).map((tok, idx) => (
                            <tr key={idx} className="hover:bg-slate-800/40">
                              <td className="py-2 px-3 text-slate-400">#{idx}</td>
                              <td className="py-2 px-3 text-cyan-300 font-bold">{tok.id}</td>
                              <td className="py-2 px-3 text-slate-200">
                                <span className="bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
                                  {tok.text === '\n' ? '\\n' : tok.text.replace(/ /g, '␣')}
                                </span>
                              </td>
                              <td className="py-2 px-3">
                                <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-purple-300 border border-purple-800/50">
                                  {tok.type}
                                </span>
                              </td>
                              <td className="py-2 px-3 text-slate-400">{tok.length} chars</td>
                              <td className="py-2 px-3 text-slate-400">{tok.bytes} B</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>

                      {currentIndex === 0 && (
                        <div className="text-slate-400 italic font-mono text-xs text-center py-20">
                          No tokens generated yet. Start playback to populate token matrix table...
                        </div>
                      )}
                    </div>
                  )}

                </div>

                {/* HOVER TOOLTIP FLOATING INSPECTOR FOOTER */}
                {hoveredToken && (
                  <div className="bg-slate-950 border-t border-slate-800 px-4 py-2 flex items-center justify-between text-xs font-mono text-slate-300">
                    <div className="flex items-center gap-3">
                      <span className="text-cyan-400 font-bold">Token #{hoveredToken.idx}</span>
                      <span>ID: <strong className="text-purple-300">{hoveredToken.id}</strong></span>
                      <span>Value: <strong className="text-emerald-300">"{hoveredToken.text.replace(/\n/g, '\\n')}"</strong></span>
                    </div>
                    <div className="flex items-center gap-3 text-slate-400">
                      <span>Type: {hoveredToken.type}</span>
                      <span>Length: {hoveredToken.length} chars</span>
                    </div>
                  </div>
                )}

              </div>

            </div>

          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-800/80 bg-slate-900/40 py-3 px-4 text-center text-xs text-slate-400 font-mono">
            LLM Token Generation Simulator • Built for AI Engineers & Researchers • Web Audio API & Subword BPE Engine
          </footer>

        </div>
      );

      function customKeyOrCustom() {
        return 'custom';
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
